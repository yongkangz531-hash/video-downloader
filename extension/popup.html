<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#0b0b12; --card:#14141f; --line:#24243a; --pri:#7c5cff; --pri2:#22d3ee;
    --txt:#eaeaf5; --dim:#9a9ab5; --dim2:#6b6b85; --ok:#54d38a; --bad:#ff6b8a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:390px;background:var(--bg);color:var(--txt);
    font:13px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px 10px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .host{font-size:11px;color:var(--dim2);max-width:190px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,monospace}
  .bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  button{border:1px solid var(--line);background:#1b1b2b;color:var(--txt);border-radius:8px;
    padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
  button:hover{background:#23233a;border-color:rgba(124,92,255,.5)}
  button.pri{background:linear-gradient(135deg,var(--pri),#5b3ce0);border-color:transparent;font-weight:600}
  button.pri:hover{filter:brightness(1.12)}
  button:disabled{opacity:.45;cursor:not-allowed}
  #list{max-height:330px;overflow:auto;padding:10px 12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;margin-bottom:8px}
  .row1{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .tag{font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);
    color:var(--dim);font-family:Consolas,monospace;flex:0 0 auto}
  .tag.hls{border-color:rgba(34,211,238,.45);color:var(--pri2)}
  .tag.dom{border-color:rgba(84,211,138,.35);color:var(--ok)}
  .name{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .url{font-size:10.5px;color:var(--dim2);font-family:Consolas,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:7px}
  .acts{display:flex;gap:7px}
  .acts button{padding:5px 11px;font-size:11.5px;border-radius:7px}
  .empty{color:var(--dim2);text-align:center;padding:26px 10px;font-size:12px;line-height:1.9}
  .foot{display:flex;justify-content:space-between;align-items:center;
    padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2)}
  .foot a{color:var(--pri2);text-decoration:none}
  .foot a:hover{text-decoration:underline}
  #msg{padding:0 14px 9px;font-size:11.5px;min-height:0;color:var(--dim)}
  #msg.err{color:var(--bad)}
  #msg.ok{color:var(--ok)}
  .spin{display:inline-block;width:9px;height:9px;border:2px solid rgba(34,211,238,.25);
    border-top-color:var(--pri2);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-1px;margin-right:5px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>视频下载器</div>
    <div class="host" id="host">—</div>
  </header>
  <div class="bar">
    <button class="pri" id="scan">扫描本页视频</button>
    <button id="clear">清空</button>
  </div>
  <div id="msg"></div>
  <div id="list"><div class="empty">点「扫描本页视频」，<br>或者先在页面上播一下视频再点</div></div>
  <div class="foot">
    <span id="count">0 个</span>
    <a href="http://127.0.0.1:8791" target="_blank">打开工具面板 →</a>
  </div>
<script src="popup.js"></script>
</body>
</html>
